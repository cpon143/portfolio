<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Instrument Serif";
      src: url("../og-fonts/instrument-serif.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("../og-fonts/plus-jakarta-400.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      src: url("../og-fonts/plus-jakarta-500.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F3EFE6;
    }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F3EFE6;
      background-image: url("paper.jpg");
      background-size: cover;
      color: #1A1916;
      -webkit-font-smoothing: antialiased;
    }
    .plate {
      position: relative;
      z-index: 1;
      width: 1040px;
      height: 470px;
      background: #FFFDF8;
      border-radius: 6px;
      box-shadow:
        0 0 0 1px rgb(26 25 22 / 0.06),
        0 18px 40px -28px rgb(26 25 22 / 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lockup {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 86%;
    }
    .eyebrow {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #1E3A32;
      margin-bottom: 22px;
    }
    .mark {
      width: 30px;
      height: 30px;
      margin-bottom: 26px;
    }
    .title {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 92px;
      line-height: 0.95;
      letter-spacing: -0.022em;
      color: #1A1916;
      white-space: nowrap;
    }
    .rule {
      width: 44px;
      height: 1.5px;
      background: #1E3A32;
      border: 0;
      margin: 26px 0 22px;
    }
    .tag {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.012em;
      color: #5C5850;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="plate">
      <div class="lockup">
        <p class="eyebrow">Independent web studio</p>
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M8 25V8l8 12 8-12v17" fill="none" stroke="#1E3A32" stroke-width="5.2" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
        <h1 class="title">MAZHARUL.DEV</h1>
        <hr class="rule" />
        <p class="tag">Websites that turn visitors into enquiries.</p>
      </div>
    </div>
  </div>
</body>
</html>
